<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>LanChat</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.6 system-ui, "Microsoft YaHei", sans-serif; background: #f2f3f5; color: #1f2329;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  main { width: min(420px, 100% - 32px); margin: 24px 0; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 20px; margin: 0 0 4px; text-align: center; }
  .card { background: #fff; border-radius: 10px; padding: 18px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
  .card b { font-size: 16px; }
  .hint { font-size: 13px; color: #86909c; margin: 4px 0 12px; }
  button { height: 36px; padding: 0 16px; border-radius: 6px; border: 1px solid #3370ff; background: #3370ff;
           color: #fff; font: inherit; cursor: pointer; }
  button.ghost { background: #fff; color: #3370ff; }
  button:disabled { opacity: .5; cursor: default; }
  .line { display: flex; gap: 8px; margin-top: 10px; }
  input { flex: 1; height: 36px; border: 1px solid #e5e6eb; border-radius: 6px; padding: 0 10px; font: inherit; outline: none; }
  input:focus { border-color: #3370ff; }
  #found button { margin: 8px 8px 0 0; }
  #msg { font-size: 13px; color: #f54a45; text-align: center; min-height: 20px; }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* 常用设备：点整行连接，右侧改名、删除 */
  .empty { font-size: 13px; color: #86909c; padding: 10px 0 2px; }
  .dev { display: flex; align-items: center; gap: 12px; padding: 10px 8px; margin: 0 -8px; border-radius: 8px; cursor: pointer;
         transition: background .15s; }
  .dev:hover { background: #f2f6ff; }
  .dev .pc { width: 36px; height: 36px; flex: none; border-radius: 8px; background: #e8f0ff; color: #3370ff;
             display: flex; align-items: center; justify-content: center; }
  .dev .pc svg.i { width: 20px; height: 20px; }
  .dev .txt { flex: 1; min-width: 0; }
  .dev .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dev .sub { font-size: 12px; color: #86909c; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dev .tool { width: 30px; height: 30px; padding: 0; border: 0; border-radius: 6px; background: none; color: #86909c;
               display: inline-flex; align-items: center; justify-content: center; opacity: 0; }
  .dev:hover .tool { opacity: 1; }
  .dev .tool:hover { background: #e5e6eb; color: #1f2329; }
  .dev .tool.del:hover { color: #f54a45; }
  .dev input { height: 30px; font-weight: 500; }
  .dev.busy { opacity: .6; pointer-events: none; }
</style>
</head>
<body>
<main>
  <h1>LanChat</h1>
  <div class="card">
    <b>常用设备</b>
    <div class="hint">点一下直接连接；对方换了 IP 也会自动找到。</div>
    <div id="favs"></div>
  </div>
  <div class="card">
    <b>这台当主机</b>
    <div class="hint">聊天记录和文件存在这台电脑上。用的时候保持它开着。</div>
    <button id="host">作为主机启动</button>
  </div>
  <div class="card">
    <b>连接另一台</b>
    <div class="hint">另一台已经作为主机启动了。先自动搜索，搜不到就手动输入主机窗口顶部显示的地址。连上后会自动加入常用设备。</div>
    <button class="ghost" id="find">自动搜索</button>
    <div id="found"></div>
    <div class="line">
      <input id="addr" placeholder="例如 192.168.3.136:8765">
      <button id="join">连接</button>
    </div>
  </div>
  <div id="msg"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const say = t => { $('msg').textContent = t; };
let favs = [];

const ICONS = {
  pc: '<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  del: '<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/>',
};
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function icon(name) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 24 24');
  s.setAttribute('class', 'i');
  s.innerHTML = ICONS[name];
  return s;
}
function tool(name, tip, cls) {
  const b = el('button', 'tool' + (cls ? ' ' + cls : ''));
  b.title = tip;
  b.appendChild(icon(name));
  return b;
}

function renderFavs() {
  if (!favs.length) {
    return void $('favs').replaceChildren(el('div', 'empty', '还没有常用设备，连接过的主机会自动出现在这里。'));
  }
  $('favs').replaceChildren(...favs.map(f => {
    const row = el('div', 'dev'), txt = el('div', 'txt'), name = el('div', 'name', f.name);
    const pc = el('div', 'pc');
    pc.appendChild(icon('pc'));
    // 副标题：电脑名（自定义名字与它相同时不重复显示）+ 上次的 IP
    const sub = [f.hostname && f.hostname !== f.name ? f.hostname : '', f.addr !== f.name ? f.addr : ''].filter(Boolean).join(' · ');
    txt.append(name, el('div', 'sub', sub));
    const edit = tool('edit', '改名'), del = tool('del', '从常用设备中移除', 'del');
    row.append(pc, txt, edit, del);
    row.title = `连接 ${f.name}`;
    row.onclick = async () => {
      row.classList.add('busy'); name.textContent = `${f.name} · 连接中…`; say('');
      try { const err = await pywebview.api.open_favorite(f.id); if (err) say(err); }
      finally { row.classList.remove('busy'); name.textContent = f.name; }
    };
    edit.onclick = e => { e.stopPropagation(); startRename(f, txt, name); };
    del.onclick = async e => {
      e.stopPropagation();
      if (!confirm(`从常用设备中移除「${f.name}」？`)) return;
      favs = await pywebview.api.remove_favorite(f.id);
      renderFavs();
    };
    return row;
  }));
}

function startRename(f, txt, name) {
  const input = el('input');
  input.value = f.name;
  input.placeholder = f.hostname || f.addr;
  input.title = '回车保存，Esc 取消；清空则恢复为电脑名';
  input.onclick = e => e.stopPropagation();
  let done = false;
  const finish = async save => {
    if (done) return;
    done = true;
    if (save && input.value.trim() !== f.name) favs = await pywebview.api.rename_favorite(f.id, input.value);
    renderFavs();
  };
  input.onkeydown = e => {
    if (e.key === 'Enter' && !e.isComposing) finish(true);
    if (e.key === 'Escape') finish(false);
  };
  input.onblur = () => finish(true);
  txt.replaceChild(input, name);
  input.focus();
  input.select();
}

function busy(btn, text, job) {
  return async (...args) => {
    const old = btn.textContent;
    btn.disabled = true; btn.textContent = text; say('');
    try { const err = await job(...args); if (err) say(err); }
    finally { btn.disabled = false; btn.textContent = old; }
  };
}

window.addEventListener('pywebviewready', async () => {
  const init = await pywebview.api.init();
  if (init.last) $('addr').value = init.last;
  if (init.error) say(init.error);
  favs = init.favorites || [];
  renderFavs();

  $('host').onclick = busy($('host'), '启动中…', () => pywebview.api.host());
  const join = busy($('join'), '连接中…', addr => pywebview.api.join(addr ?? $('addr').value));
  $('join').onclick = () => join();
  $('addr').onkeydown = e => { if (e.key === 'Enter') join(); };
  $('find').onclick = busy($('find'), '搜索中…', async () => {
    const hosts = await pywebview.api.find();
    $('found').replaceChildren(...hosts.map(h => {
      // 已在常用设备里的显示自定义名字，否则显示电脑名；旧版主机没有电脑名，只显示地址
      const fav = favs.find(f => h.id && f.id === h.id);
      const label = fav ? fav.name : h.hostname;
      const b = document.createElement('button');
      b.className = 'ghost'; b.textContent = label ? `连接 ${label}（${h.addr}）` : `连接 ${h.addr}`;
      b.onclick = () => { $('addr').value = h.addr; join(h.addr); };
      return b;
    }));
    if (!hosts.length) return '没搜到，可能两台不在同一网段，请手动输入地址';
  });
});
</script>
</body>
</html>
